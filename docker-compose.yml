version: '3.8'
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: fulcrum
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d fulcrum"]
      interval: 10s
      timeout: 5s
      retries: 5

  fulcrum:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: fulcrum

  test:
    image: golang:alpine
    working_dir: /app
    volumes:
      - .:/app
    command: go test -v ./... -run TestIntegration
    depends_on:
      fulcrum:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: fulcrum
      FULCRUM_URL: http://fulcrum:8080

volumes:
  postgres_data: